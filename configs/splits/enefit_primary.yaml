# Frozen split for the Enefit predictive-utility experiments (section 8.1).
#
# The competition's own release logic is kept: these boundaries bound prediction times, and
# a record enters a feature only when its data_block_id was released. Reconstructing training
# rows from data the time-series API would have revealed later is forbidden by section 8.1,
# and the block schedule — not this file — is what enforces it.
schema_version: "0.1.0"
name: enefit_primary
dataset: enefit_prosumers
version: kaggle-2023

# A week, as elsewhere: targets are revealed with a delivery lag, so a fold boundary without
# a gap would score a period whose labels were partly visible during training.
gap: P7D

train:
  start: "2021-09-01T00:00:00Z"
  end: "2023-01-01T00:00:00Z"
validation:
  start: "2023-01-08T00:00:00Z"
  end: "2023-03-01T00:00:00Z"
test:
  start: "2023-03-08T00:00:00Z"
  end: "2023-06-01T00:00:00Z"

# Prediction units withheld from training, for entity-held-out transfer to a county and
# customer-segment combination (section 8.1).
held_out_entities:
  - "9"
  - "15"

rationale: >-
  Sixteen months of training covers more than one heating season, which is the seasonal
  structure the consumption target actually has. Validation and test are consecutive later
  periods so that the evaluation is forward in time, as a deployed system would be.

notes:
  - "Prediction unit identifiers confirmed 2026-09-10 against train.csv, which carries 69
     units numbered 0 to 68; the held-out units 9 and 15 exist."
  - "Weather is not yet readable per prosumer -- 112 grid points collapse onto one stream per
     unit -- so a run under this split must exclude the two weather files until the declared
     entity graph of section 5.3 exists. See docs/decision_log.md."
  - "Consumption and production are separate targets, target_consumption and
     target_production, and are scored separately."
