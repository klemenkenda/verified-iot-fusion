# Frozen split for the USCRN temporal-correctness experiments (section 8.2).
#
# Section 9 requires split definitions to be frozen in version-controlled configuration
# before the final sweep. This file is that freeze: its hash is recorded in every run
# manifest as split_manifest_hash, so a run computed under a different split cannot be
# mistaken for one computed under this.
schema_version: "0.1.0"
name: uscrn_primary
dataset: uscrn_hourly02
version: hourly02

# Chronological, never shuffled. The gap between folds is a week because a delayed relay can
# carry an observation several hours late and the quality-controlled product is republished
# much later still; a week is comfortably beyond both.
gap: P7D

train:
  start: "2019-01-01T00:00:00Z"
  end: "2022-01-01T00:00:00Z"
validation:
  start: "2022-01-08T00:00:00Z"
  end: "2022-07-01T00:00:00Z"
test:
  start: "2022-07-08T00:00:00Z"
  end: "2023-01-01T00:00:00Z"

# Stations withheld from training entirely, for the entity-held-out transfer claim of H5.
held_out_entities:
  - "53131"
  - "94074"

rationale: >-
  Three full years of training so that a full seasonal cycle appears more than once, then
  half-year validation and test periods that are long enough for the delayed-delivery
  behaviour of section 8.2 to appear at every hour of the day.

notes:
  - "Station identifiers are WBANNO values, confirmed 2026-09-10 against the downloaded 2023
     update archive: 53131 and 94074 are both present, as is 94075, the station of the
     committed final file."
  - "SUPERSEDED as an experiment, and not by a download. These periods start in 2019, and the
     hourly update archive begins 2020-10-06 20:00 UTC -- there is no 2019 directory and there
     will not be one, because earlier years exist only as quality-controlled yearly products
     that record no delivery time. Availability cannot be reconstructed before that instant.
     Use a split inside the archive window; section 12 forbids editing this one in place."
  - "Periods bound prediction times, not observation times: a record from before the train
     boundary may still be read by a test-period feature, which is correct — that is history,
     not leakage."
