# The USCRN split that supersedes uscrn_primary, sized to the evidence that exists.
#
# uscrn_primary trains from 2019-01-01. The hourly update archive begins 2020-10-06 20:00 UTC
# and there is no 2019 directory -- earlier years exist only as quality-controlled yearly
# products, which record no delivery time. Availability cannot be reconstructed before that
# instant, so that split is not waiting on a download; it is unsatisfiable. Section 12 forbids
# editing a frozen split in place, so this is a new one rather than a correction.
#
# What is kept from uscrn_primary is its rationale: three full years of training so that a
# seasonal cycle appears more than once, then consecutive forward-in-time validation and test
# periods long enough for the delayed-delivery behaviour of section 8.2 to appear at every hour
# of the day. What changes is only where those three years sit.
schema_version: "0.1.0"
name: uscrn_archive
dataset: uscrn_hourly02
version: hourly02

# A week, as in every split here: a delayed relay can carry an observation ten hours late (the
# measured tail on this station), and the quality-controlled product is republished a month
# later still. A week is comfortably beyond both.
gap: P7D

train:
  start: "2020-10-07T00:00:00Z"
  end: "2023-07-01T00:00:00Z"
validation:
  start: "2023-07-08T00:00:00Z"
  end: "2023-10-01T00:00:00Z"
test:
  start: "2023-10-08T00:00:00Z"
  end: "2023-12-25T00:00:00Z"

# Stations withheld from training entirely, for the entity-held-out transfer claim of H5. Both
# are real WBANNO values present in the archive. They can only be *scored*, however, once their
# quality-controlled yearly files are downloaded too -- tools/fetch_uscrn.py takes --station.
held_out_entities:
  - "53131"
  - "94074"

rationale: >-
  Two years and nine months of training, beginning the day after the update archive does and
  running to mid-2023, then a quarter of validation and a quarter of test. The training period
  covers three winters and three summers, which is the seasonal structure hourly temperature
  actually has. The test period stops before the year ends because the target's declared
  publication delay is thirty days.

notes:
  - "Supersedes uscrn_primary, which starts before the update archive does. Compare results
     across the two only if you have first checked that uscrn_primary was runnable at all."
  - "Training starts 2020-10-07, one day after the archive's first dissemination window
     (2020-10-06 20:00 UTC), so the first training day has a full history behind it."
  - "Targets come from the yearly quality-controlled files and this split spans four of them:
     pass --option final=final/CRNH0203-2020-...,final/CRNH0203-2021-..., and so on."
  - "Periods bound prediction times, not observation times: a record from before the train
     boundary may still be read by a test-period feature, which is history, not leakage."
