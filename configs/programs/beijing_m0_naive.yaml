# M0 — the forecasting floor for Beijing station PM2.5.
#
# A naive forecast written as a feature program rather than as a separate code path, for the
# reason the USCRN floor gives: a floor computed by its own routine could read an instant the
# replay clock had not released, and a floor that quietly sees the future makes every method
# above it look unimpressive for the wrong reason.
#
# Three naive forecasts are emitted. `persistence` is the last PM2.5 the station delivered;
# `seasonal` is the reading from exactly twenty-four hours before the prediction time; and
# `seasonal_or_last` is the seasonal one with persistence as its fallback.
#
# **The third exists because the first two cannot be scored here.** `seasonal` is the right
# floor for a quantity with a daily cycle, but `lag` is exact and this dataset has real gaps:
# measured over the 4,248 validation prediction times, the 24-hour lag is null at every one of
# the twelve stations, from 54 times at Wanliu to 269 at Dongsi. A floor that declines those
# instances is a filter rather than a floor, and the runtime refuses it. Until 2026-09-11 the
# only scoreable alternative was plain persistence. `coalesce` was added to the registry for
# exactly this case, and this is its first use.
#
# **What the comparison then showed was the opposite of what was expected**, which is why the
# task scores both: persistence reaches MAE 45.6 and the seasonal naive only 52.0. Particulate
# concentration at a 24-hour horizon owes less to the time of day than temperature or household
# consumption do. An assumption that the seasonal branch must be the stronger floor -- carried
# over from the other two datasets -- would have understated the floor by five MAE and
# flattered every fitted method above it.
#
# Unlike USCRN and Enefit, availability here is **simulated** — the dataset records none — so
# what this floor is allowed to see is a declared assumption rather than a measurement. The
# scenario name is in every record's derivation and in the run manifest; a floor computed
# under `staggered` is not comparable to one computed under `prompt`.
#
# The floor reads the measurement stream, never `beijing_target`. Targets are the same
# quantity with a different reveal delay, which is exactly why the separation is structural.
schema_version: "0.1.0"
name: beijing_m0_naive

sources:
  - source_id: beijing_air
    feature_name: pm2_5
    kind: measurement
    value_type: number
    unit: microgram / meter ** 3
    max_input_rate_per_hour: 2
    description: Fine particulates, as delivered under the declared arrival scenario.

nodes:
  - id: persistence
    op: last
    params: {source: beijing_air, feature: pm2_5}
  - id: seasonal
    op: lag
    params: {source: beijing_air, feature: pm2_5, lag: 24h}

  # Selection, not imputation: both branches are declared expressions the compiler checked,
  # and the value that comes out carries the lineage of whichever one answered — so the audit
  # still says which reading the floor used, rather than reporting a number from nowhere. The
  # fallback fires on roughly 3% of this station's prediction times.
  - id: seasonal_or_last
    op: coalesce
    inputs: [seasonal, persistence]

outputs:
  - persistence
  - seasonal
  - seasonal_or_last
