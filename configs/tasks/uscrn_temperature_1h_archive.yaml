# One-hour-ahead USCRN station temperature, over the whole archive that exists.
#
# This is the Gate B task: the same question as uscrn_temperature_1h, run under
# configs/splits/uscrn_archive.yaml rather than the unsatisfiable uscrn_primary, against every
# year of the update archive NOAA publishes. Nearly three years of training, so the seasonal
# structure the naive floor exploits appears more than once.
#
# The searching methods were absent from this file until 2026-09-11, on the reasoning that
# Phase 6 asks whether the *baselines* are credible and M3 answers a later question. That was
# wrong in one respect worth recording: M3 *is* a baseline -- section 9.1 names it as the one
# H1 actually has to clear -- and M2 turned out to be level with M1 on two of three datasets,
# which makes the question of whether an automated search can reach the expert bar a Phase 6
# credibility question rather than a Phase 7 one. They are declared below. What stays a later
# question is the comparison that decides H1, which happens on the test fold after the Gate C
# freeze; every number this file produces on validation is in-sample for the searching and
# tuned methods and is marked as such.
schema_version: "0.1.0"
name: uscrn_temperature_1h_archive

dataset: uscrn
root: data/raw/uscrn
options:
  stations: "94075"
  # One quality-controlled file per year, and this split spans four.
  final: >-
    final/CRNH0203-2020-CO_Boulder_14_W.txt,final/CRNH0203-2021-CO_Boulder_14_W.txt,final/CRNH0203-2022-CO_Boulder_14_W.txt,final/CRNH0203-2023-CO_Boulder_14_W.txt

target_source: uscrn_final
target_feature: t_hr_avg
horizon: PT1H
prediction_interval: PT1H

split: uscrn_archive

predictors: [ridge, lightgbm]

methods:
  - id: M0
    program: configs/programs/uscrn_m0_naive.yaml
    predictor: identity
    output: persistence
    description: >-
      Forecasting floor: the last hourly-mean temperature the station delivered, returned
      unchanged. Nothing is fitted, and the value is read through the same replay clock as
      every other method.

  - id: M1
    program: configs/programs/uscrn_m1_raw_calendar.yaml
    description: >-
      Raw current values plus calendar features. Separates the value of a fitted model from
      the value of engineered features, which is what M2's margin over it means.

  - id: M2
    program: configs/programs/uscrn_temperature.yaml
    description: >-
      Expert-engineered features after the iot-fusion vocabulary: windowed statistics,
      staleness, gap counts, and within-source fusion. The human bar H1 must clear.

  # The budget is 3500 candidate evaluations for both searching methods, from the rule in
  # evaluation.experiment.budget_for: max_features x the candidate count the declared grid
  # produces over this dataset's searchable sources, rounded up to the next 500. Measured
  # 2026-09-11: 264 candidates. That figure is a property of the *space* rather than of a
  # strategy, so greedy, random and later the LLM conditions all spend the same number here.
  # Re-freeze it if the operator registry or the grid changes; a protocol test fails when the
  # declared figure no longer covers the space.
  #
  # No `entity_graphs` block: USCRN publishes no declared edge, so there is no cross-entity
  # candidate to generate and nothing for a search to miss. On Enefit, which does publish one,
  # leaving the block out is refused.
  - id: M3
    search:
      strategy: greedy
      evaluations: 3500
      max_features: 12
      seed: 20260911
      space:
        timezone: UTC
    description: >-
      Non-LLM automated search over the operator registry, forward selection. The baseline H1
      actually has to clear: section 9.1 expects it to be strong, and a weak one would make
      the headline claim unfalsifiable rather than easy.

  - id: M3r
    search:
      strategy: random
      evaluations: 3500
      max_features: 12
      seed: 20260911
      space:
        timezone: UTC
    description: >-
      The same budget spent at random rather than greedily. Reported beside M3 because
      "random search over a well-designed registry" is the phrase a reviewer will have in
      mind, and the two are different baselines rather than two names for one.


  - id: M3f
    search:
      strategy: fastener
      evaluations: 3500
      max_features: 12
      seed: 20260911
      space:
        timezone: UTC
    description: >-
      FASTENER (`koprivec2020fastener`), the multiobjective genetic selection of the
      predecessor research line, spending the same budget as M3 and M3r. Its crossover weights
      features by mutual information and it keeps a Pareto front indexed by feature count, so
      unlike forward selection it is not committed to its early choices -- which is the
      property that should matter when the budget buys only a few full sweeps of the space.

      Run through the authors' own pinned package rather than a reimplementation, so that a
      result reported under this name is the published algorithm. See docs/decision_log.md.

rationale: >-
  What a one-hour horizon means on this dataset is the whole point of choosing it. Availability
  is the close of the dissemination window, so the freshest observation at prediction time t
  describes t - 1h, and a one-hour-ahead forecast is really two hours out from the last data
  anyone had. The naive floor is correspondingly weaker than the textbook one -- its MASE lands
  near two rather than near one -- and that gap is the phenomenon the dataset was chosen to
  expose, not an artifact of the task.

  Measured on this station's 2023 archive: 99.46 per cent of observations arrive one hour after
  the hour they describe and the rest tail out to ten, so a method that ignored availability
  would be right almost always and wrong in a way no aggregate metric would show. That is an
  argument for the per-decision audit rather than for a different dataset.
