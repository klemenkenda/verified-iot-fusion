# The vertical slice of section 11.0: USCRN, one task, no LLM.
#
# One-hour-ahead station air temperature, which section 8.2 names as a candidate task. The
# target is the quality-controlled final product — section 8.2 permits it as a target and
# forbids it as a replay input — so the reveal delay is the declared publication lag, and a
# model may fit on an example only once that target was published.
#
# This file is hashed into every run manifest as `task_config_hash`, so editing it changes the
# identity of every run that used it. Change it by adding a version, not in place, once
# official runs begin (section 12).
schema_version: "0.1.0"
name: uscrn_temperature_1h

dataset: uscrn
root: data/raw/uscrn
options:
  final: final/CRNH0203-2023-CO_Boulder_14_W.txt

target_source: uscrn_final
target_feature: t_hr_avg
horizon: PT1H
prediction_interval: PT1H

split: uscrn_primary

# The downstream model grid of section 9.2: a linear reference and a nonlinear one, so that
# H1 can say whether an effect is model-specific. Every method below runs under both, except
# the naive floor, which returns a feature unchanged and is not a modelling choice.
predictors: [ridge, lightgbm]

# Methods, in the order the results table reports them. M4 is optional and M5 to M8 arrive
# with the LLM loop; everything below is the non-LLM comparison the plan asks for.
methods:
  - id: M0
    program: configs/programs/uscrn_m0_naive.yaml
    predictor: identity
    output: persistence
    description: >-
      Forecasting floor: the last hourly-mean temperature the station delivered, returned
      unchanged. Nothing is fitted, and the value is read through the same replay clock as
      every other method.

  - id: M1
    program: configs/programs/uscrn_m1_raw_calendar.yaml
    description: >-
      Raw current values plus calendar features. Separates the value of a fitted model from
      the value of engineered features, which is what M2's margin over it means.

  - id: M2
    program: configs/programs/uscrn_temperature.yaml
    description: >-
      Expert-engineered features after the iot-fusion vocabulary: windowed statistics,
      staleness, gap counts, and within-source fusion. The human bar H1 must clear.

  # The budget is 3500 candidate evaluations for both searching methods, from the rule in
  # evaluation.experiment.budget_for: max_features x the candidate count the declared grid
  # produces over this dataset's searchable sources, rounded up to the next 500. That is what
  # a full greedy forward selection needs to finish, and it is a property of the space rather
  # than of a strategy — so random search and, later, the LLM conditions spend the same number
  # on this task. Re-freeze it if the operator registry or the grid changes; a test fails when
  # the declared figure no longer covers the space.
  - id: M3
    search:
      strategy: greedy
      evaluations: 3500
      max_features: 12
      seed: 20260910
    description: >-
      Non-LLM automated search over the operator registry, forward selection. The baseline
      H1 actually has to clear: section 9.1 expects it to be strong, and a weak one would
      make the headline claim unfalsifiable rather than easy.

  - id: M3r
    search:
      strategy: random
      evaluations: 3500
      max_features: 12
      seed: 20260910
    description: >-
      The same budget spent at random rather than greedily. Reported beside M3 because
      "random search over a well-designed registry" is the phrase a reviewer will have in
      mind, and the two are different baselines rather than two names for one.

rationale: >-
  One-hour-ahead temperature is the cheapest honest task on this dataset: the target is
  well behaved, the naive floor is genuinely strong, and the delivery delay that makes USCRN
  interesting shows up directly in how often a feature is null at prediction time. If the
  evaluation pipeline is wrong, it will be wrong here in a way that is easy to see.

  Note what a one-hour horizon means on this dataset. Availability is the close of the
  dissemination window, so the freshest observation at prediction time t describes t - 1h,
  and a one-hour-ahead forecast is really two hours out from the last data anyone had. The
  naive floor is correspondingly weaker than the textbook one — its MASE lands near two
  rather than near one — and that gap is the phenomenon the dataset was chosen to expose,
  not an artifact of the task.
