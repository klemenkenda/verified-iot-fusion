# Day-ahead hourly consumption for Enefit prediction units — the section 8.1 primary task.
#
# Section 8.1 names "day-ahead hourly consumption forecasting" first among this dataset's
# tasks, so the horizon is 24 hours and predictions are made every hour. What makes that
# horizon interesting here is not its length but what is *knowable* at the moment it is made:
# the competition delivers a day's data in one block, and a target is handed back two blocks
# after the one that asked for it, so the freshest consumption anyone holds at a prediction
# time is 11 to 35 hours old (measured on the real archive, unit 7, first fortnight of the
# validation fold). A day-ahead forecast is therefore two to three days out from the last
# consumption figure that existed — the delayed-label regime this dataset was chosen for.
#
# **This is the task that was blocked.** Until the declared entity graph existed, weather was
# 112 grid points collapsed onto one stream per prosumer and no Enefit result could be
# reported at all. Weather now enters through the `weather_stations` edge, which is why this
# file can exist.
#
# The searching methods are deliberately absent, exactly as in the USCRN Gate B task: Phase 6
# asks whether the *baselines* are credible. M3 and M3r cost two full budgets per predictor
# and answer a Phase 7 question. Add them once these numbers are believed.
schema_version: "0.1.0"
name: enefit_consumption_day_ahead

dataset: enefit
root: data/raw/enefit
options:
  # The declared block release schedule; see docs/decision_log.md, 2026-09-10.
  first_block_id: "0"
  first_release: "2021-08-31T11:00:00+03:00"
  # Only the files these programs read. The two weather files are the expensive ones and the
  # forecast half is not read by any method here, so naming the sources keeps the read to
  # what the task needs rather than the whole competition.
  sources: enefit_target,enefit_client,enefit_electricity,enefit_weather_actual

target_source: enefit_target
target_feature: target_consumption
horizon: PT24H
prediction_interval: PT1H

split: enefit_primary

# A small panel rather than all 69 units, for the same reason the USCRN Gate B task runs one
# station: this is a credibility check on the baselines, and 69 units on an hourly grid buys
# precision the question does not need.
#
# The three are chosen to vary the thing this task is here to exercise — how many weather
# entities a unit reads through. Measured on the real archive: unit 7 maps to one station,
# units 20 and 41 to four each. Units 9 and 15 are excluded because the split holds them out
# for the transfer question, and unit 49 because its county is the unrecorded "UNKNOWN" and it
# maps to no station at all; it is the right subject for a later test of that case, not for a
# first credibility check.
entities: ["7", "20", "41"]

predictors: [ridge, lightgbm]

methods:
  - id: M0
    program: configs/programs/enefit_m0_naive.yaml
    predictor: identity
    output: seasonal
    description: >-
      Forecasting floor: the consumption this unit recorded at the same hour two days ago,
      returned unchanged. Forty-eight hours rather than twenty-four because a target's own
      delivery lag reaches thirty-five, so the same hour yesterday is not reliably available;
      the floor is read through the same replay clock as every other method.

  - id: M1
    program: configs/programs/enefit_m1_raw_calendar.yaml
    description: >-
      Raw current values of the same four sources M2 engineers, plus calendar features.
      Separates the value of a fitted model from the value of engineered features.

  - id: M2
    program: configs/programs/enefit_consumption.yaml
    description: >-
      Expert-engineered features: windowed consumption statistics, staleness, the county's
      averaged weather through the declared entity graph, a day-ahead price, and consumption
      normalised by contracted capacity. The human bar H1 must clear.

rationale: >-
  Heterogeneous fusion is the reason this dataset is the primary one, and until now it could
  not be demonstrated: a prosumer's own streams are dense and its weather lives on other
  entities entirely. M2 here reads four sources with three different availability shapes -- a
  label delivered two blocks late, a measurement belonging to neighbouring entities, a
  forward-looking price selected by issue, and a static contract fact -- which is the section
  8.1 experiment in one feature vector.

  What this task cannot yet ask is the forecast half of the weather question. A cross-entity
  read of an archived weather *forecast* needs an operator that does not exist -- cross-entity
  aggregation currently refuses forecast sources rather than silently reading one grid point --
  so M2 is a thinner expert program than the USCRN one, and that should be remembered when its
  margin over M1 is read.
