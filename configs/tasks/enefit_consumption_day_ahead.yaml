# Day-ahead hourly consumption for Enefit prediction units — the section 8.1 primary task.
#
# Section 8.1 names "day-ahead hourly consumption forecasting" first among this dataset's
# tasks, so the horizon is 24 hours and predictions are made every hour. What makes that
# horizon interesting here is not its length but what is *knowable* at the moment it is made:
# the competition delivers a day's data in one block, and a target is handed back two blocks
# after the one that asked for it, so the freshest consumption anyone holds at a prediction
# time is 11 to 35 hours old (measured on the real archive, unit 7, first fortnight of the
# validation fold). A day-ahead forecast is therefore two to three days out from the last
# consumption figure that existed — the delayed-label regime this dataset was chosen for.
#
# **This is the task that was blocked.** Until the declared entity graph existed, weather was
# 112 grid points collapsed onto one stream per prosumer and no Enefit result could be
# reported at all. Weather now enters through the `weather_stations` edge, which is why this
# file can exist.
#
# The searching methods are deliberately absent, exactly as in the USCRN Gate B task: Phase 6
# asks whether the *baselines* are credible. M3 and M3r cost two full budgets per predictor
# and answer a Phase 7 question. Add them once these numbers are believed.
schema_version: "0.1.0"
name: enefit_consumption_day_ahead

dataset: enefit
root: data/raw/enefit
options:
  # The declared block release schedule; see docs/decision_log.md, 2026-09-10.
  first_block_id: "0"
  first_release: "2021-08-31T11:00:00+03:00"
  # Only the files these programs read. The two weather files are the expensive ones and the
  # forecast half is not read by any method here, so naming the sources keeps the read to
  # what the task needs rather than the whole competition. `enefit_electricity` left this list
  # on 2026-09-11 with the price feature that was its only reader.
  sources: enefit_target,enefit_client,enefit_weather_actual
  # The same unit named below, given to the *adapter* rather than only to the runner: this
  # narrows the read itself, and with it the weather grid points, to the four stations this
  # unit's county contains instead of all 112.
  entities: "65"

target_source: enefit_target
target_feature: target_consumption
horizon: PT24H
prediction_interval: PT1H

split: enefit_primary

# One unit, for the same reason the USCRN Gate B task runs one station — and here for two
# further reasons, both found by running the alternatives.
#
# **A panel is not free: one model is fitted across every entity named here, and nothing in the
# feature vector says which entity a row came from.** A first version of this task ran units 0,
# 10 and 31 together. Their median hourly consumption is 379, 474 and 17.7 kWh — a factor of
# twenty-five — so a single ridge or LightGBM had to fit one function across all three, while
# the naive floor stayed per-entity by construction and beat every fitted method. M2 under
# LightGBM reached an R-squared of -0.72 with a bias of +351. None of that was about feature
# engineering; it was about pooling entities a pooled model cannot tell apart. Reporting by
# county or customer segment (section 8.1) needs either an entity feature or a per-entity fit,
# and neither exists yet.
#
# **The unit is chosen for level stationarity, and that choice is a declared criterion rather
# than a preference.** Measured over all 69 units, the ratio of validation-fold mean to
# training-fold mean has a median of 1.80: the Enefit prosumer population grew substantially
# across 2021-2023, and the split boundary — correctly forward in time — cuts through that
# growth. R-squared is scored against the validation mean, so on a growing unit every method
# is punished for being anchored on training-era levels, and the metric reads near zero or
# negative however good the features are. That is a property of the dataset, not of the
# method, and a credibility check cannot be run through it.
#
# The criterion, fixed before any score was seen: not held out by the split; the 48-hour floor
# resolves at every validation prediction time (no gap in the validation window pushed back 72
# hours); validation/training mean ratio within [0.90, 1.10]; ties broken by weather fan-out,
# largest first, since cross-entity reading is what this task exists to exercise. Exactly two
# units qualify — 65 at ratio 1.014 with four stations, and 36 at 0.968 with three — and unit
# 65 wins both legs. Unit 47 looks stationary at 0.960 but has 1,224 missing hours in the
# window the floor must reach; unit 10 is complete but sits at 0.805.
#
# Unit 0, whose ratio is 2.34, is kept as the companion task in
# configs/tasks/enefit_consumption_day_ahead_growth.yaml. Read the two together: this file asks
# whether the baselines are credible, that one shows what the growth regime does to them.
#
# Measured over all 69 units: 63 have a series complete enough that a 48-hour seasonal lag
# resolves at every validation prediction time, and 6 do not. An earlier panel included unit 41,
# whose series is 6,072 hours out of 14,928 and which ends two weeks early; the floor was null
# at 168 of 1,248 prediction times and the run refused it, correctly, as a filter rather than a
# floor. Units 9 and 15 are held out by the split for the transfer question. Unit 49's county is
# the unrecorded "UNKNOWN" so it maps to no station at all; it has a complete series and is the
# right subject for a later test of the null-weather case.
entities: ["65"]

predictors: [ridge, lightgbm]

methods:
  - id: M0
    program: configs/programs/enefit_m0_naive.yaml
    predictor: identity
    output: seasonal
    description: >-
      Forecasting floor: the consumption this unit recorded at the same hour two days ago,
      returned unchanged. Forty-eight hours rather than twenty-four because a target's own
      delivery lag reaches thirty-five, so the same hour yesterday is not reliably available;
      the floor is read through the same replay clock as every other method.

  - id: M1
    program: configs/programs/enefit_m1_raw_calendar.yaml
    description: >-
      Raw current values of the same three sources M2 engineers, plus calendar features.
      Separates the value of a fitted model from the value of engineered features.

  - id: M2
    program: configs/programs/enefit_consumption.yaml
    description: >-
      Expert-engineered features: windowed consumption statistics, staleness, the county's
      averaged weather through the declared entity graph, and consumption normalised by
      contracted capacity. The human bar H1 must clear.

rationale: >-
  Heterogeneous fusion is the reason this dataset is the primary one, and until now it could
  not be demonstrated: a prosumer's own streams are dense and its weather lives on other
  entities entirely. M2 here reads three sources with three different availability shapes -- a
  label delivered two blocks late, a measurement belonging to neighbouring entities, and a
  static contract fact -- which is the section 8.1 experiment in one feature vector, minus the
  forward-looking one: the price node was removed on 2026-09-11 as a feature null in every row,
  and no forecast source on this dataset is readable cross-entity yet.

  What this task cannot yet ask is the forecast half of the weather question. A cross-entity
  read of an archived weather *forecast* needs an operator that does not exist -- cross-entity
  aggregation currently refuses forecast sources rather than silently reading one grid point --
  so M2 is a thinner expert program than the USCRN one, and that should be remembered when its
  margin over M1 is read.
