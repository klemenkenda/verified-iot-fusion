# The companion to enefit_consumption_day_ahead: the same task on a *growing* prediction unit.
#
# Read configs/tasks/enefit_consumption_day_ahead.yaml first. This file is identical to it
# except for the unit, and it exists to show the one thing that unit was chosen to exclude.
#
# **Enefit's folds do not share a level, and that is a property of the dataset.** Across all 69
# units the ratio of validation-fold mean consumption to training-fold mean has a median of
# 1.80; only two units sit inside [0.90, 1.10]. The prosumer population grew substantially over
# 2021-2023 and the split boundary, correctly forward in time, cuts through that growth. Unit 0
# is an ordinary instance of it rather than an outlier: ratio 2.34, monthly mean consumption
# rising from 105 kWh in September 2021 to 1,011 in December 2022, contracted capacity from 953
# to 5,251 kW over the same span.
#
# What that does to the metrics is worth having on the record. R-squared is scored against the
# *validation* mean, so every method anchored on training-era levels is punished for it, and on
# this unit the whole ladder lands at or below zero. That is not a pipeline fault: computed
# directly from the raw series, outside the pipeline entirely, the floor's own comparison
# reproduces its reported figures to the digit. MASE does not rescue it either, since it scales
# from training targets.
#
# The delayed-label cost is unusually legible here, measured on the raw series: predicting
# y(t+24) scores R-squared 0.31 from y(t), -0.14 from y(t-24), and -0.37 from y(t-48) — and
# only the last is available in time. The decay across those three is the regime this dataset
# was chosen for, priced.
#
# Unit 0 also has the largest weather fan-out of any unit: its county holds six grid points, so
# `cross_entity_mean` averages six stations rather than trivially passing one through.
#
# **Do not read a Gate B verdict off this file.** The baselines' credibility is judged on the
# stationary unit; what this one measures is the growth regime, and the two answer different
# questions.
schema_version: "0.1.0"
name: enefit_consumption_day_ahead_growth

dataset: enefit
root: data/raw/enefit
options:
  # The declared block release schedule; see docs/decision_log.md, 2026-09-10.
  first_block_id: "0"
  first_release: "2021-08-31T11:00:00+03:00"
  # Only the files these programs read. The two weather files are the expensive ones and the
  # forecast half is not read by any method here, so naming the sources keeps the read to
  # what the task needs rather than the whole competition.
  sources: enefit_target,enefit_client,enefit_electricity,enefit_weather_actual
  # The same unit named below, given to the *adapter* rather than only to the runner: this
  # narrows the read itself, and with it the weather grid points, to the six stations this
  # unit's county contains instead of all 112.
  entities: "0"

target_source: enefit_target
target_feature: target_consumption
horizon: PT24H
prediction_interval: PT1H

split: enefit_primary

# One unit, and for the panel reason set out in the primary task: one model is fitted across
# every entity named here and nothing in the feature vector says which entity a row came from,
# so a panel spanning scales measures pooling damage rather than feature engineering.
#
# Unit 0's series is complete — 15,308 values over 15,312 hourly slots, the four gaps falling
# outside the validation window — so nothing here is a completeness artefact.
entities: ["0"]

predictors: [ridge, lightgbm]

methods:
  - id: M0
    program: configs/programs/enefit_m0_naive.yaml
    predictor: identity
    output: seasonal
    description: >-
      Forecasting floor: the consumption this unit recorded at the same hour two days ago,
      returned unchanged. Forty-eight hours rather than twenty-four because a target's own
      delivery lag reaches thirty-five, so the same hour yesterday is not reliably available;
      the floor is read through the same replay clock as every other method.

  - id: M1
    program: configs/programs/enefit_m1_raw_calendar.yaml
    description: >-
      Raw current values of the same four sources M2 engineers, plus calendar features.
      Separates the value of a fitted model from the value of engineered features.

  - id: M2
    program: configs/programs/enefit_consumption.yaml
    description: >-
      Expert-engineered features: windowed consumption statistics, staleness, the county's
      averaged weather through the declared entity graph, a day-ahead price, and consumption
      normalised by contracted capacity. The human bar H1 must clear.

rationale: >-
  A result that says "every method scores at or below zero" is worth reporting only if it is
  accompanied by the reason, and the reason is measurable: the fold boundary crosses a growth
  regime this unit is squarely inside. Kept as a task rather than a note so the claim can be
  rerun rather than believed.

  One signal from the first run is the reason this file is not merely a cautionary note. M2
  was the only method to clear zero on this unit, and it is the only one carrying
  `load_factor` -- consumption normalised by contracted capacity, the feature that should
  absorb exactly this kind of capacity-driven growth. That is a single unit and a single fold
  and is not evidence of anything on its own, but it is the observation that makes the pairing
  of these two tasks more interesting than the stationary one alone.
