# Delayed labels and static facts.
#
# For a label record, event_time IS label_time and available_time IS label_available_time
# (see vifusion.temporal.records). A label may be used for learning or scoring only from its
# reveal, which is what makes delayed-label evaluation honest.
family: labels_and_statics

scenarios:
  - name: label_is_not_usable_before_it_is_revealed
    description: >-
      The outcome has occurred but has not been reported. Training on it now would be
      training on information the deployed system could not have had.
    records:
      - id: y1
        kind: label
        feature: target
        event_time: "2024-01-01T01:00:00Z"
        available_time: "2024-01-01T03:00:00Z"
        value: 99.0
    specs: []
    prediction_time: "2024-01-01T02:00:00Z"
    expect:
      eligible: []
      usable_labels: []

  - name: label_is_usable_at_the_exact_reveal_time
    description: The inclusive boundary again, applied to label reveal.
    records:
      - id: y1
        kind: label
        feature: target
        event_time: "2024-01-01T01:00:00Z"
        available_time: "2024-01-01T03:00:00Z"
        value: 99.0
    specs: []
    prediction_time: "2024-01-01T03:00:00Z"
    expect:
      eligible: [y1]
      usable_labels: [y1]

  - name: label_is_usable_after_it_is_revealed
    description: And remains usable thereafter.
    records:
      - id: y1
        kind: label
        feature: target
        event_time: "2024-01-01T01:00:00Z"
        available_time: "2024-01-01T03:00:00Z"
        value: 99.0
      - id: y2
        kind: label
        feature: target
        event_time: "2024-01-01T02:00:00Z"
        available_time: "2024-01-01T06:00:00Z"
        value: 98.0
    specs: []
    prediction_time: "2024-01-01T04:00:00Z"
    expect:
      eligible: [y1]
      usable_labels: [y1]

  - name: static_fact_is_usable_from_its_availability
    description: >-
      A site's altitude, registered long before the study period. Static facts are records
      like any other and obey the same eligibility rule.
    records:
      - id: alt
        kind: static
        feature: altitude
        event_time: "2020-01-01T00:00:00Z"
        available_time: "2020-01-01T00:00:00Z"
        value: 350.0
        unit: m
    specs:
      - name: site_altitude
        op: last_value
        feature: altitude
    prediction_time: "2024-01-01T00:00:00Z"
    expect:
      eligible: [alt]
      values:
        site_altitude: 350.0
      lineage:
        site_altitude: [alt]

  - name: static_fact_registered_later_is_invisible_earlier
    description: >-
      A fact known to the researcher today was not known to the system in 2024. Backfilled
      metadata is a quiet and common leak.
    records:
      - id: alt
        kind: static
        feature: altitude
        event_time: "2020-01-01T00:00:00Z"
        available_time: "2024-06-01T00:00:00Z"
        value: 350.0
        unit: m
    specs:
      - name: site_altitude
        op: last_value
        feature: altitude
    prediction_time: "2024-01-01T00:00:00Z"
    expect:
      eligible: []
      values:
        site_altitude: null
      lineage:
        site_altitude: []

  - name: categorical_value_is_returned_unchanged
    description: >-
      Values may be categories as well as scalars (section 5.1). A category passes through
      last-value untouched; aggregates over it would be a type error, which the Phase 3
      compiler rejects statically.
    records:
      - id: c1
        feature: condition
        event_time: "2024-01-01T00:00:00Z"
        value: rain
    specs:
      - name: last_condition
        op: last_value
        feature: condition
    prediction_time: "2024-01-01T00:30:00Z"
    expect:
      values:
        last_condition: rain
      lineage:
        last_condition: [c1]
