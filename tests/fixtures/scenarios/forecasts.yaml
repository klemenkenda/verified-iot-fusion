# Revisable forecasts. Section 5.2: select the latest eligible issue whose valid time
# satisfies the specification, and a forecast issued after t stays unavailable even if it
# describes a valid time before or after t.
#
# The distinction between issued_time and available_time carries a section 14 risk of its
# own: a forecast run issued at 00:00 may not be published until 01:00, and treating the
# issue time as the availability time leaks the publication lag.
family: forecasts

scenarios:
  - name: forecast_latest_eligible_issue_wins
    description: Two issues for the same valid time; the newer eligible one is selected.
    records:
      - id: f_old
        kind: forecast
        feature: temp_fc
        issued_time: "2024-01-01T00:00:00Z"
        available_time: "2024-01-01T00:00:00Z"
        event_time: "2024-01-01T00:00:00Z"
        valid_time: "2024-01-01T02:00:00Z"
        value: 10.0
      - id: f_new
        kind: forecast
        feature: temp_fc
        issued_time: "2024-01-01T01:00:00Z"
        available_time: "2024-01-01T01:00:00Z"
        event_time: "2024-01-01T01:00:00Z"
        valid_time: "2024-01-01T02:00:00Z"
        value: 12.0
    specs:
      - name: fc_1h
        op: forecast
        feature: temp_fc
        lead: 1h
    prediction_time: "2024-01-01T01:00:00Z"
    expect:
      eligible: [f_old, f_new]
      values:
        fc_1h: 12.0
      lineage:
        fc_1h: [f_new]

  - name: forecast_revision_issued_after_prediction_time_is_ignored
    description: >-
      The revision exists in the log and is better, but was issued after the prediction
      time. Using it would be the most tempting kind of leak.
    records:
      - id: f_old
        kind: forecast
        feature: temp_fc
        issued_time: "2024-01-01T00:00:00Z"
        available_time: "2024-01-01T00:00:00Z"
        event_time: "2024-01-01T00:00:00Z"
        valid_time: "2024-01-01T02:00:00Z"
        value: 10.0
      - id: f_future
        kind: forecast
        feature: temp_fc
        issued_time: "2024-01-01T01:30:00Z"
        available_time: "2024-01-01T01:30:00Z"
        event_time: "2024-01-01T01:30:00Z"
        valid_time: "2024-01-01T02:00:00Z"
        value: 12.0
    specs:
      - name: fc_1h
        op: forecast
        feature: temp_fc
        lead: 1h
    prediction_time: "2024-01-01T01:00:00Z"
    expect:
      eligible: [f_old]
      values:
        fc_1h: 10.0
      lineage:
        fc_1h: [f_old]

  - name: forecast_is_unavailable_until_published
    description: >-
      Issued at 00:00 but not published until 01:00. Availability, not issue time, governs
      eligibility — the section 14 risk "forecast issue time differs from publication time".
    records:
      - id: f1
        kind: forecast
        feature: temp_fc
        issued_time: "2024-01-01T00:00:00Z"
        available_time: "2024-01-01T01:00:00Z"
        event_time: "2024-01-01T00:00:00Z"
        valid_time: "2024-01-01T02:00:00Z"
        value: 10.0
    specs:
      - name: fc_90m
        op: forecast
        feature: temp_fc
        lead: 90m
    prediction_time: "2024-01-01T00:30:00Z"
    expect:
      eligible: []
      values:
        fc_90m: null
      lineage:
        fc_90m: []

  - name: forecast_becomes_available_at_publication
    description: The same forecast once published is eligible.
    records:
      - id: f1
        kind: forecast
        feature: temp_fc
        issued_time: "2024-01-01T00:00:00Z"
        available_time: "2024-01-01T01:00:00Z"
        event_time: "2024-01-01T00:00:00Z"
        valid_time: "2024-01-01T02:00:00Z"
        value: 10.0
    specs:
      - name: fc_1h
        op: forecast
        feature: temp_fc
        lead: 1h
    prediction_time: "2024-01-01T01:00:00Z"
    expect:
      eligible: [f1]
      values:
        fc_1h: 10.0
      lineage:
        fc_1h: [f1]

  - name: forecast_for_a_different_valid_time_is_not_selected
    description: Lead time selects the valid time exactly; neighbouring horizons do not substitute.
    records:
      - id: f_2h
        kind: forecast
        feature: temp_fc
        issued_time: "2024-01-01T00:00:00Z"
        available_time: "2024-01-01T00:00:00Z"
        event_time: "2024-01-01T00:00:00Z"
        valid_time: "2024-01-01T02:00:00Z"
        value: 10.0
      - id: f_3h
        kind: forecast
        feature: temp_fc
        issued_time: "2024-01-01T00:00:00Z"
        available_time: "2024-01-01T00:00:00Z"
        event_time: "2024-01-01T00:00:00Z"
        valid_time: "2024-01-01T03:00:00Z"
        value: 20.0
    specs:
      - name: fc_1h
        op: forecast
        feature: temp_fc
        lead: 1h
    prediction_time: "2024-01-01T01:00:00Z"
    expect:
      eligible: [f_2h, f_3h]
      values:
        fc_1h: 10.0
      lineage:
        fc_1h: [f_2h]

  - name: forecast_issued_after_t_is_invisible_even_for_a_past_valid_time
    description: >-
      The exact sentence in section 5.2: a forecast issued after t must remain unavailable
      even if it describes a valid time before t. A negative lead addresses that hindcast.
    records:
      - id: f_hindcast
        kind: forecast
        feature: temp_fc
        issued_time: "2024-01-01T02:00:00Z"
        available_time: "2024-01-01T02:00:00Z"
        event_time: "2024-01-01T02:00:00Z"
        valid_time: "2024-01-01T00:30:00Z"
        value: 5.0
    specs:
      - name: fc_back_30m
        op: forecast
        feature: temp_fc
        lead: -30m
    prediction_time: "2024-01-01T01:00:00Z"
    expect:
      eligible: []
      values:
        fc_back_30m: null
      lineage:
        fc_back_30m: []

  - name: forecast_tie_on_issue_time_is_broken_deterministically
    description: >-
      Two issues sharing an issue time and an availability. The revision id breaks the tie,
      so the result cannot depend on the order the records were ingested.
    records:
      - id: f_r1
        kind: forecast
        feature: temp_fc
        revision: r1
        issued_time: "2024-01-01T01:00:00Z"
        available_time: "2024-01-01T01:00:00Z"
        event_time: "2024-01-01T01:00:00Z"
        valid_time: "2024-01-01T02:00:00Z"
        value: 10.0
      - id: f_r2
        kind: forecast
        feature: temp_fc
        revision: r2
        issued_time: "2024-01-01T01:00:00Z"
        available_time: "2024-01-01T01:00:00Z"
        event_time: "2024-01-01T01:00:00Z"
        valid_time: "2024-01-01T02:00:00Z"
        value: 12.0
    specs:
      - name: fc_1h
        op: forecast
        feature: temp_fc
        lead: 1h
    prediction_time: "2024-01-01T01:00:00Z"
    expect:
      values:
        fc_1h: 12.0
      lineage:
        fc_1h: [f_r2]

  - name: forecast_absent_for_the_requested_horizon_is_null
    description: No issue covers the requested valid time.
    records:
      - id: f_2h
        kind: forecast
        feature: temp_fc
        issued_time: "2024-01-01T00:00:00Z"
        available_time: "2024-01-01T00:00:00Z"
        event_time: "2024-01-01T00:00:00Z"
        valid_time: "2024-01-01T02:00:00Z"
        value: 10.0
    specs:
      - name: fc_6h
        op: forecast
        feature: temp_fc
        lead: 6h
    prediction_time: "2024-01-01T01:00:00Z"
    expect:
      values:
        fc_6h: null
      lineage:
        fc_6h: []
