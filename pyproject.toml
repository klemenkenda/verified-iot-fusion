[project]
name = "vifusion"
version = "0.0.0"
description = "Verified LLM-assisted feature engineering for heterogeneous IoT streams"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Klemen Kenda", email = "klemen.kenda@ijs.si" }]

# Only dependencies that are actually imported are declared here, and uv.lock pins the
# full resolved graph. The remaining tools of section 6 of docs/research_plan.md enter as
# optional groups when the phase that needs them lands, so that a clean checkout at any
# commit installs exactly what that commit uses.
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    # Compile-time dimensional analysis only: section 6 keeps Pint quantities out of the
    # hot loop, because they would dominate the very latency numbers RQ4 reports.
    "pint>=0.24",
    # The IANA timezone database, pinned rather than inherited from the host. Windows
    # ships none at all, and where an OS does provide one its version is unrecorded --
    # which is the defect docs/original_system_audit.md finding 6 describes, in a new
    # form: a calendar feature must not depend on which machine computed it.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# Phase 3 onwards: columnar transformation, analytical replay, compile-time units.
data = ["polars>=1.0", "duckdb>=1.0"]
# Phase 6 onwards: incremental models and the tabular baseline. NumPy is declared rather
# than inherited from LightGBM: vifusion.models.predictors imports it directly to build the
# feature matrix, and this file's rule is that what is imported is declared.
ml = ["river>=0.21", "lightgbm>=4.5", "numpy>=2.0"]

[project.scripts]
vifusion = "vifusion.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vifusion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Section 10.5 requires performance tests to run separately from the fast suite, so the
# default invocation excludes them; CI runs them in a step of their own.
addopts = "--strict-markers -q -m 'not slow'"
markers = [
    "slow: performance tests, run separately per section 10.5",
]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.12"
strict = true
warn_unreachable = true

# Environment capture branches on sys.platform, so one branch is statically dead on
# whichever platform mypy runs on. CI type-checks on both Linux and Windows, which
# covers each branch once; the unreachable warning here would only ever be noise.
[[tool.mypy.overrides]]
module = "vifusion.environment"
warn_unreachable = false
